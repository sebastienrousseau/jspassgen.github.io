<!DOCTYPE html>
<html lang="en-GB" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="keywords" content="password generator, diceware passphrase, quantum resistant, argon2id, honeywords, shannon entropy, webcrypto, offline generator, zero dependency, jspassgen" />
    <meta name="author" content="Sebastien Rousseau" />
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com;" />
    
    <link rel="canonical" href="https://jspassgen.com/" />
    <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
    <link rel="alternate icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    
    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jspassgen.com/" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="https://jspassgen.com/images/screenshot.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="https://jspassgen.com/images/screenshot.png" />
    
    <!-- JSON-LD Structured Data for Search & AI Agents -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://jspassgen.com/#website",
            "url": "https://jspassgen.com/",
            "name": "jspassgen",
            "description": "Zero-dependency, quantum-resistant password and EFF Diceware passphrase generator.",
            "inLanguage": "en-GB"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://jspassgen.com/#software",
            "name": "jspassgen",
            "operatingSystem": "All (Web, Node.js, CLI)",
            "applicationCategory": "SecurityApplication",
            "softwareVersion": "0.0.19",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "author": {
              "@type": "Person",
              "name": "Sebastien Rousseau",
              "url": "https://sebastienrousseau.com/"
            },
            "license": "https://github.com/sebastienrousseau/jspassgen/blob/main/LICENSE-MIT"
          }
        ]
      }
    </script>
    
    <link rel="stylesheet" href="skeletonic.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme-init.js"></script>
  </head>
  <body class="style-jspassgen">
    <a class="skip-link" href="#main">Skip to main content</a>
    {{> header}}
    <main id="main">
      {{#block "main"}}{{/block}}
    </main>
    {{> footer}}
    <script src="main.js" defer></script>
  </body>
</html>
