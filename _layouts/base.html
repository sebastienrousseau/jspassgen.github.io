            "@type": "Person",

            "name": "Sebastien Rousseau",
            "url": "https://sebastienrousseau.com/",
            "jobTitle": "Security Engineer & Systems Architect",
            "knowsAbout": [
              "Cryptography",
              "Information Theory",
              "Web Cryptography API",
              "Key Derivation Functions",
              "Zero-Trust Architecture"
            ],
            "sameAs": [
              "https://github.com/sebastienrousseau",
              "https://www.linkedin.com/in/sebastienrousseau/",
              "https://orcid.org/0000-0002-0487-1478",
              "https://wikidata.org/wiki/Q110298075"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://jspassgen.com/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How does jspassgen differ from a password vault like 1Password or Bitwarden?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "jspassgen is an isolated cryptographic generation tool, not a remote storage vault. Cloud vaults store, synchronize, and auto-fill your credentials across devices, requiring ongoing trust in third-party servers. jspassgen focuses exclusively on generating mathematically uncompromised passwords, Diceware passphrases, and decoy honeywords locally in volatile memory with zero network activity and zero disk persistence."
                }
              },
              {
                "@type": "Question",
                "name": "How does jspassgen adhere to NIST SP 800-63B guidelines?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "NIST SP 800-63B (Digital Identity Guidelines) advises minimum length floors of 8 characters (recommending up to 64 or more for automated systems), support for ASCII printable characters, and explicitly rejects superstitious composition mandates (like forcing one symbol or one number) that reduce overall entropy by inducing predictable user habits. jspassgen adheres strictly to these principles by measuring true informational entropy and utilizing hardware-bound CSPRNG."
                }
              },
              {
                "@type": "Question",
                "name": "Are passwords generated by jspassgen ever transmitted over a network?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Absolutely nothing leaves your machine. jspassgen executes 100% locally inside your browser using the W3C Web Cryptography API (window.crypto.getRandomValues) or Node.js native crypto module. There are no analytics trackers, no telemetry pings, and no database logs."
                }
              },
              {
                "@type": "Question",
                "name": "What makes EFF Diceware superior to simple character strings?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Standard random passwords draw uniformly from character alphabets (uppercase, lowercase, numbers, symbols) to maximize entropy density per character. EFF Diceware passphrases draw random words from the curated 7,776-word dictionary compiled by the Electronic Frontier Foundation. A 5-word Diceware passphrase provides approximately 65 bits of entropy and is exceptionally easy for humans to type and remember, while remaining immune to brute-force dictionary attacks."
                }
              },
              {
                "@type": "Question",
                "name": "How does Honeywords decoy generation protect against database breaches?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Invented by cryptographic researchers Ari Juels and Ronald L. Rivest, the Honeywords defense stores k - 1 decoy passwords alongside the genuine password in a hashed credential store. To an external attacker who dumps the database and cracks the hashes, all k passwords appear equally valid. When the attacker attempts to authenticate with any decoy password, a canary trap immediately alerts security operations and freezes the compromised account before the attacker can test the real password."
                }
              },
              {
                "@type": "Question",
                "name": "Why is Shannon Entropy more accurate than a simple character count?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Naive password meters simply count length or reward predictable patterns like adding an exclamation mark at the end. Claude Shannon's information entropy formula H(X) = -∑ p(x) log₂(p(x)) measures the exact uncertainty and unpredictability of the symbol probability distribution. This reveals whether a password has true cryptographic variance or repetitive bias."
                }
              }
            ]
          }
        ]
